name: Beta feedback
description: Report a sanitized reproducible beta problem or compatibility result
title: "[Beta] "
labels: ["beta"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, private addresses, full structures, or unmasked states.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, LoxBerry, architecture, Miniserver firmware and MCP client
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only masked plugin output and steps to reproduce.
