MCP_CERTIFICATE_HINT=The web server certificate must match the address in use. Some MCP clients reject a private IP address for the OAuth server; use the hostname address in that case.
PROJECT=Open project and guides

[CERTIFICATE]
TITLE=Web server certificate
TEXT=This diagnostic reads the system-wide LoxBerry HTTPS certificate. It does not display SAN names or private addresses.
SOURCE=Issuer
SOURCE_LOXBERRY=LoxBerry CA
SOURCE_EXTERNAL=External or unknown
EXPIRES=Valid until
DNS_SANS=Number of DNS SANs
IP_SANS=Number of IP SANs
ORIGIN_MATCH=Matches the configured MCP origin
HOSTNAME_MATCH=Contains the current LoxBerry hostname
YES=Yes
NO=No
NOT_CONFIGURED=Not configured
WARNING=The certificate does not match every name required for MCP. Check the configured HTTPS origin and reissue the certificate if needed.
RENEWAL_STATE=Reissue status
RENEW_TEXT=Reissuing replaces the system-wide LoxBerry web server certificate and its private server key. The existing LoxBerry CA is retained. Apache restarts briefly and interrupts HTTPS connections.
PIN=SecurePIN
CONFIRM=I confirm the system-wide reissue and the brief HTTPS interruption.
UNSUPPORTED=Reissuing is not available here. It is offered only for a certificate issued by the local LoxBerry CA and a supported LoxBerry Core.
UNAVAILABLE=The LoxBerry web server certificate could not be read.
STATE_IDLE=Not started
STATE_SCHEDULED=Reissue scheduled. The HTTPS connection will be interrupted briefly.
STATE_RUNNING=Reissuing certificate …
STATE_SUCCESS=The certificate was reissued and verified.
STATE_ERROR=Reissue failed. The LoxBerry system log contains the masked failure status.
ERROR_PIN_INVALID=The SecurePIN must contain exactly four digits.
ERROR_PIN_WRONG=The SecurePIN is incorrect.
ERROR_PIN_LOCKED=The SecurePIN is temporarily locked after repeated failures.
ERROR_PIN_UNAVAILABLE=The SecurePIN could not be checked.
ERROR_CONFIRMATION=The system-wide reissue was not confirmed.
ERROR_BUSY=A certificate reissue is already in progress.
ERROR_UNSUPPORTED=Certificate reissuing is not supported by this installation.
ERROR_FAILED=The certificate reissue could not be started.

