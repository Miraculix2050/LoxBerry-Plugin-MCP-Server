[HELP]
TITLE=Help and developer tools
PROJECT=Open project and guides
PROJECT_HELP=Documentation for setting up, using and troubleshooting the plugin. The project also provides release notes and a place to report issues.
EXPLORER_HELP=Shows the MCP tools available on this installation and their parameters. After signing in, you can try calls and inspect results; actions that make changes require the corresponding permissions.
