KNX_HELP=Manage KNX group addresses and address labels, import ETS data and compare inventories with the Loxone project. You can also manage separate MCP permissions for the KNX catalog and shared correction drafts here.
PROFILE_HELP=Assign explicitly confirmed roles to measurement points and states, such as generation, consumption or storage. These declarations help MCP interpret your installation; roles are not inferred from names and do not replace technical verification.
MESSAGES_HELP=Use a preview ID to inspect the specific system message and intended action. You grant one-time local approval for the subsequent MCP call; the required Loxone permissions are still needed.
