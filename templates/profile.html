<link rel="stylesheet" href="mcp-ui.css?v=<TMPL_VAR VERSION ESCAPE=HTML>-profile-v1">
<main class="mcp-page" id="profile-page"
 data-saved="<TMPL_VAR PROFILE.SAVED ESCAPE=HTML>"
 data-error="<TMPL_VAR PROFILE.ERROR ESCAPE=HTML>"
 data-edit="<TMPL_VAR PROFILE.EDIT ESCAPE=HTML>"
 data-delete="<TMPL_VAR PROFILE.DELETE ESCAPE=HTML>"
 data-delete-binding-confirm="<TMPL_VAR PROFILE.DELETE_BINDING_CONFIRM ESCAPE=HTML>"
 data-delete-all-confirm="<TMPL_VAR PROFILE.DELETE_ALL_CONFIRM ESCAPE=HTML>"
 data-delete-confirm-title="<TMPL_VAR PROFILE.CONFIRM_TITLE ESCAPE=HTML>"
 data-permission-title="<TMPL_VAR PROFILE.PERMISSION_TITLE ESCAPE=HTML>"
 data-permission-confirm="<TMPL_VAR PROFILE.PERMISSION_CONFIRM ESCAPE=HTML>"
 data-permission-change="<TMPL_VAR PROFILE.PERMISSION_CHANGE ESCAPE=HTML>"
 data-permission-allow="<TMPL_VAR PROFILE.PERMISSION_ALLOW ESCAPE=HTML>"
 data-permission-revoke="<TMPL_VAR PROFILE.PERMISSION_REVOKE ESCAPE=HTML>"
 data-permission-enabled="<TMPL_VAR PROFILE.PERMISSION_ENABLED ESCAPE=HTML>"
 data-permission-disabled="<TMPL_VAR PROFILE.PERMISSION_DISABLED ESCAPE=HTML>"
 data-truncated="<TMPL_VAR PROFILE.TRUNCATED ESCAPE=HTML>"
 data-pv-range-error="<TMPL_VAR PROFILE.PV_RANGE_ERROR ESCAPE=HTML>"
 data-flex-unavailable="<TMPL_VAR PROFILE.FLEX_UNAVAILABLE ESCAPE=HTML>"
 data-flex-error="<TMPL_VAR PROFILE.FLEX_ERROR ESCAPE=HTML>"
 data-empty="<TMPL_VAR PROFILE.EMPTY ESCAPE=HTML>"
 data-draft="<TMPL_VAR PROFILE.DRAFT ESCAPE=HTML>"
 data-confirmed="<TMPL_VAR PROFILE.CONFIRMED ESCAPE=HTML>"
 data-needs_review="<TMPL_VAR PROFILE.NEEDS_REVIEW ESCAPE=HTML>"
 data-invalid="<TMPL_VAR PROFILE.INVALID ESCAPE=HTML>">
 <a class="lb-button" href="index.cgi"><TMPL_VAR PROFILE.BACK></a>
 <h1><TMPL_VAR PROFILE.TITLE></h1>
 <p><TMPL_VAR PROFILE.HELP></p>
 <p id="profile-status" role="status" aria-live="polite"></p>
 <section class="mcp-card">
  <h2><TMPL_VAR PROFILE.PERMISSION_TITLE></h2>
  <p><TMPL_VAR PROFILE.PERMISSION_HELP></p>
  <fieldset id="profile-permission-fields" disabled>
   <label><input id="profile-permission-enabled" type="checkbox"><TMPL_VAR PROFILE.PERMISSION_ENABLED></label>
   <button id="profile-permission-save" class="lb-button" type="button"><TMPL_VAR PROFILE.PERMISSION_CHANGE></button>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PERMISSION_CLIENT></span><select id="profile-permission-client"></select></label>
   <button id="profile-permission-allow" class="lb-button" type="button"><TMPL_VAR PROFILE.PERMISSION_ALLOW></button>
   <ul id="profile-permission-bindings"></ul>
  </fieldset>
 </section>
 <section class="mcp-card">
  <h2><TMPL_VAR PROFILE.BINDINGS></h2>
  <ul id="profile-bindings"></ul>
  <button type="button" class="lb-button" id="profile-more" hidden><TMPL_VAR PROFILE.MORE></button>
  <button type="button" class="lb-button" id="profile-delete-all" disabled><TMPL_VAR PROFILE.DELETE_ALL></button>
 </section>
 <section class="mcp-card">
  <h2><TMPL_VAR PROFILE.EDIT></h2>
  <form id="profile-form" class="mcp-form">
   <fieldset disabled id="profile-fields">
    <label class="mcp-field"><span><TMPL_VAR PROFILE.SOURCE></span><select id="profile-source"></select></label>
    <p id="profile-source-notice"></p>
    <details id="profile-exact"><summary><TMPL_VAR PROFILE.EXACT_IDS></summary>
     <label class="mcp-field"><span><TMPL_VAR PROFILE.CONTROL_ID></span><input id="profile-control" maxlength="128" required></label>
     <label class="mcp-field"><span><TMPL_VAR PROFILE.SOURCE_KIND></span><select id="profile-kind"><option value="state"><TMPL_VAR PROFILE.STATE></option><option value="statistic"><TMPL_VAR PROFILE.STATISTIC></option><option value="weather"><TMPL_VAR PROFILE.WEATHER></option></select></label>
     <label class="mcp-field"><span><TMPL_VAR PROFILE.SOURCE_ID></span><input id="profile-source-id" maxlength="128" required></label>
    </details>
    <fieldset id="profile-weather-fields" hidden disabled>
     <label class="mcp-field"><span><TMPL_VAR PROFILE.WEATHER_MODE></span><select id="profile-weather-mode"><option value="actual"><TMPL_VAR PROFILE.WEATHER_ACTUAL></option><option value="forecast"><TMPL_VAR PROFILE.WEATHER_FORECAST></option></select></label>
     <label class="mcp-field"><span><TMPL_VAR PROFILE.WEATHER_FIELD></span><select id="profile-weather-field">
      <option value="weather_type"><TMPL_VAR PROFILE.WEATHER_TYPE></option><option value="wind_direction"><TMPL_VAR PROFILE.WIND_DIRECTION></option><option value="solar_radiation"><TMPL_VAR PROFILE.SOLAR_RADIATION></option><option value="relative_humidity"><TMPL_VAR PROFILE.RELATIVE_HUMIDITY></option><option value="temperature"><TMPL_VAR PROFILE.TEMPERATURE></option><option value="perceived_temperature"><TMPL_VAR PROFILE.PERCEIVED_TEMPERATURE></option><option value="dew_point"><TMPL_VAR PROFILE.DEW_POINT></option><option value="precipitation"><TMPL_VAR PROFILE.PRECIPITATION></option><option value="wind_speed"><TMPL_VAR PROFILE.WIND_SPEED></option><option value="barometric_pressure"><TMPL_VAR PROFILE.BAROMETRIC_PRESSURE></option>
     </select></label>
     <p class="mcp-help"><TMPL_VAR PROFILE.WEATHER_HELP></p>
    </fieldset>
    <label class="mcp-field"><span><TMPL_VAR PROFILE.ROLE></span><select id="profile-role">
     <option value="production"><TMPL_VAR PROFILE.PRODUCTION></option>
     <option value="grid_import"><TMPL_VAR PROFILE.GRID_IMPORT></option>
     <option value="grid_export"><TMPL_VAR PROFILE.GRID_EXPORT></option>
     <option value="house_consumption"><TMPL_VAR PROFILE.HOUSE_CONSUMPTION></option>
     <option value="self_consumption"><TMPL_VAR PROFILE.SELF_CONSUMPTION></option>
     <option value="storage_charge"><TMPL_VAR PROFILE.STORAGE_CHARGE></option>
     <option value="storage_discharge"><TMPL_VAR PROFILE.STORAGE_DISCHARGE></option>
     <option value="consumer"><TMPL_VAR PROFILE.CONSUMER></option>
     <option value="actual_temperature"><TMPL_VAR PROFILE.ACTUAL_TEMPERATURE></option>
     <option value="target_temperature"><TMPL_VAR PROFILE.TARGET_TEMPERATURE></option>
     <option value="room_sensor"><TMPL_VAR PROFILE.ROOM_SENSOR></option>
     <option value="operating_state"><TMPL_VAR PROFILE.OPERATING_STATE></option>
     <option value="door_contact"><TMPL_VAR PROFILE.DOOR_CONTACT></option>
     <option value="window_contact"><TMPL_VAR PROFILE.WINDOW_CONTACT></option>
     <option value="lighting_intent"><TMPL_VAR PROFILE.LIGHTING_INTENT></option>
     <option value="weather_context"><TMPL_VAR PROFILE.WEATHER></option>
    </select></label>
    <label class="mcp-field"><span><TMPL_VAR PROFILE.BOUNDARY></span><input id="profile-boundary" maxlength="128"></label>
    <label class="mcp-field"><span><TMPL_VAR PROFILE.DIRECTION></span><select id="profile-direction"><option value=""><TMPL_VAR PROFILE.UNKNOWN></option><option value="import"><TMPL_VAR PROFILE.GRID_IMPORT></option><option value="export"><TMPL_VAR PROFILE.GRID_EXPORT></option><option value="charge"><TMPL_VAR PROFILE.STORAGE_CHARGE></option><option value="discharge"><TMPL_VAR PROFILE.STORAGE_DISCHARGE></option></select></label>
    <label class="mcp-field"><span><TMPL_VAR PROFILE.RATIONALE></span><input id="profile-rationale" maxlength="256"></label>
    <section id="profile-pv-section">
     <label><input type="checkbox" id="profile-pv-enabled"><TMPL_VAR PROFILE.PV_PARAMETERS></label>
     <fieldset id="profile-pv-fields" disabled>
      <p class="mcp-help"><TMPL_VAR PROFILE.PV_HELP></p>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_CAPACITY></span><input id="profile-pv-capacity" type="number" min="0" max="1000000" step="any" data-positive></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_LATITUDE></span><input id="profile-pv-latitude" type="number" min="-90" max="90" step="any"></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_LONGITUDE></span><input id="profile-pv-longitude" type="number" min="-180" max="180" step="any"></label>
      <div id="profile-pv-arrays"></div>
      <button type="button" class="lb-button" id="profile-pv-add-array"><TMPL_VAR PROFILE.PV_ADD_ARRAY></button>
     </fieldset>
    </section>
    <section id="profile-flex-section" hidden>
     <label><input type="checkbox" id="profile-flex-enabled"><TMPL_VAR PROFILE.FLEX_ENABLE></label>
     <fieldset id="profile-flex-fields" disabled>
      <p class="mcp-help"><TMPL_VAR PROFILE.FLEX_HELP></p>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_TIMEZONE></span><input id="profile-flex-timezone" maxlength="128" placeholder="Europe/Berlin" required></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_OPERATING></span><select id="profile-flex-operating" required></select></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_IDENTITY></span><select id="profile-flex-identity"><option value="active_episode_only"><TMPL_VAR PROFILE.FLEX_EPISODE></option><option value="user_confirmed_cycle"><TMPL_VAR PROFILE.FLEX_CYCLE></option></select></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_COMPLETION></span><input id="profile-flex-completion" type="time" required></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_COMPLETION_DAY></span><select id="profile-flex-completion-day"><option value="0"><TMPL_VAR PROFILE.FLEX_SAME_DAY></option><option value="1"><TMPL_VAR PROFILE.FLEX_NEXT_DAY></option></select></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_DURATION></span><input id="profile-flex-duration" type="number" min="1" max="86400" step="1" required></label>
      <label><input id="profile-flex-interruptible" type="checkbox"><TMPL_VAR PROFILE.FLEX_INTERRUPTIBLE></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_MIN_RUN></span><input id="profile-flex-min-run" type="number" min="0" max="86400" step="1" value="0" required></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_MIN_OFF></span><input id="profile-flex-min-off" type="number" min="0" max="86400" step="1" value="0" required></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_ORIGIN></span><select id="profile-flex-origin"><option value="observed_intervals"><TMPL_VAR PROFILE.FLEX_MEASURED></option><option value="user_declared"><TMPL_VAR PROFILE.FLEX_DECLARED></option></select></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_ENERGY></span><input id="profile-flex-energy" type="number" min="0" max="1000000000" step="any" disabled></label>
      <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_RATIONALE></span><input id="profile-flex-rationale" maxlength="256" required></label>
      <div id="profile-flex-windows"></div>
      <button type="button" class="lb-button" id="profile-flex-add-window"><TMPL_VAR PROFILE.FLEX_ADD_WINDOW></button>
     </fieldset>
    </section>
    <label><input type="checkbox" id="profile-confirmed"><TMPL_VAR PROFILE.CONFIRM_ROLE></label>
    <p class="mcp-help"><TMPL_VAR PROFILE.CONFIRM_HELP></p>
    <div class="mcp-actions"><button class="lb-button" type="submit"><TMPL_VAR PROFILE.SAVE></button><button class="lb-button" type="button" id="profile-new"><TMPL_VAR PROFILE.NEW></button></div>
   </fieldset>
  </form>
 </section>
 <template id="profile-flex-window-template">
  <fieldset>
   <legend><TMPL_VAR PROFILE.FLEX_WINDOW></legend>
   <label><input type="checkbox" data-weekday value="0"><TMPL_VAR PROFILE.FLEX_MONDAY></label>
   <label><input type="checkbox" data-weekday value="1"><TMPL_VAR PROFILE.FLEX_TUESDAY></label>
   <label><input type="checkbox" data-weekday value="2"><TMPL_VAR PROFILE.FLEX_WEDNESDAY></label>
   <label><input type="checkbox" data-weekday value="3"><TMPL_VAR PROFILE.FLEX_THURSDAY></label>
   <label><input type="checkbox" data-weekday value="4"><TMPL_VAR PROFILE.FLEX_FRIDAY></label>
   <label><input type="checkbox" data-weekday value="5"><TMPL_VAR PROFILE.FLEX_SATURDAY></label>
   <label><input type="checkbox" data-weekday value="6"><TMPL_VAR PROFILE.FLEX_SUNDAY></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_START></span><input data-key="start" type="time" required></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_END></span><input data-key="end" type="time" required></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.FLEX_END_DAY></span><select data-key="end_day_offset"><option value="0"><TMPL_VAR PROFILE.FLEX_SAME_DAY></option><option value="1"><TMPL_VAR PROFILE.FLEX_NEXT_DAY></option></select></label>
   <button type="button" class="lb-button" data-remove><TMPL_VAR PROFILE.FLEX_REMOVE_WINDOW></button>
  </fieldset>
 </template>
 <template id="profile-pv-array-template">
  <fieldset>
   <legend><TMPL_VAR PROFILE.PV_ARRAY></legend>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_ARRAY_ID></span><input data-key="array_id" maxlength="64" pattern="[A-Za-z0-9_-]{1,64}" required></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_CAPACITY></span><input data-key="installed_kwp" type="number" min="0" max="1000000" step="any" data-positive></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_AZIMUTH></span><input data-key="azimuth_degrees" type="number" min="0" max="360" step="any" data-exclusive-max="360"></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_TILT></span><input data-key="tilt_degrees" type="number" min="0" max="90" step="any"></label>
   <label class="mcp-field"><span><TMPL_VAR PROFILE.PV_SHADING></span><input data-key="shading" maxlength="256"></label>
   <button type="button" class="lb-button" data-remove><TMPL_VAR PROFILE.PV_REMOVE_ARRAY></button>
  </fieldset>
 </template>
 <dialog class="mcp-dialog" id="profile-confirm" aria-labelledby="profile-confirm-title" aria-describedby="profile-confirm-message">
  <h2 id="profile-confirm-title"><TMPL_VAR PROFILE.CONFIRM_TITLE></h2>
  <p id="profile-confirm-message"></p>
  <form method="dialog" class="mcp-actions">
   <button class="lb-button" id="profile-confirm-cancel" value="cancel" autofocus><TMPL_VAR PROFILE.CANCEL></button>
   <button class="lb-button" id="profile-confirm-action" value="confirm"><TMPL_VAR PROFILE.DELETE></button>
  </form>
 </dialog>
</main>
<script src="profile.js?v=<TMPL_VAR VERSION ESCAPE=HTML>-profile-v5" defer></script>
