<style>
  .mcp-page { max-width: 76rem; margin: 0 auto; padding: .5rem; overflow-wrap: anywhere; }
  .mcp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
  .mcp-card { min-width: 0; padding: 1rem; border: 1px solid #c9cdd2; border-radius: .4rem; background: #fff; }
  .mcp-form { display: grid; gap: .85rem; }
  .mcp-field { display: grid; gap: .3rem; min-width: 0; }
  .mcp-field input,
  .mcp-field select { box-sizing: border-box; width: 100%; max-width: 100%; min-height: 2.75rem; }
  .mcp-manual-endpoint[hidden] { display: none; }
  .mcp-help { margin: 0; color: #4b5563; }
  .mcp-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .mcp-actions button { min-height: 2.75rem; max-width: 100%; }
  .mcp-copy-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; align-items: end; }
  .mcp-copy-row input { box-sizing: border-box; width: 100%; min-height: 2.75rem; font-family: monospace; }
  .mcp-copy-row button { min-height: 2.75rem; }
  .mcp-status { padding: .65rem; border-left: .3rem solid #6b7280; background: #f3f4f6; }
  .mcp-status[data-kind="success"] { border-color: #198754; }
  .mcp-status[data-kind="error"] { border-color: #b91c1c; }
  .mcp-warning { padding: .65rem; border-left: .3rem solid #b45309; background: #fff7ed; }
  .mcp-table-wrap { max-width: 100%; overflow-x: auto; }
  .mcp-table { width: 100%; border-collapse: collapse; }
  .mcp-table th, .mcp-table td { padding: .5rem; text-align: left; border-bottom: 1px solid #ddd; }
  .mcp-page :focus-visible { outline: 3px solid #1261a0; outline-offset: 2px; }
  @media (max-width: 30rem) {
    .mcp-card { padding: .75rem; }
    .mcp-actions > * { width: 100%; }
    .mcp-copy-row { grid-template-columns: minmax(0, 1fr); }
    .mcp-copy-row button { width: 100%; }
    #diagnostics .lb-table-scroll { overflow-x: visible; }
    #diagnostics .lb-table,
    #diagnostics .lb-table tbody,
    #diagnostics .lb-table tr,
    #diagnostics .lb-table td { display: block; box-sizing: border-box; width: 100%; min-width: 0; }
    #diagnostics .lb-table tr { padding: .35rem 0; border-bottom: 1px solid #ddd; }
    #diagnostics .lb-table td { padding: .25rem 0; border: 0; overflow-wrap: anywhere; }
    #diagnostics .lb-table td:first-child,
    #diagnostics .lb-table td:last-child { display: none; }
  }
</style>

<main class="mcp-page">
  <TMPL_IF NOTICE><div id="page-notice" class="mcp-status" role="status" data-kind="<TMPL_VAR NOTICE_KIND ESCAPE=HTML>"><TMPL_VAR NOTICE ESCAPE=HTML></div></TMPL_IF>
  <div id="ajax-status" class="mcp-status" role="status" aria-live="polite" hidden></div>

  <section id="setup" class="mcp-card" aria-labelledby="setup-title">
    <h2 id="setup-title"><TMPL_VAR SETUP.TITLE></h2>
    <form class="mcp-form" method="post" action="index.cgi" data-ajax="save_config">
      <input type="hidden" name="action" value="save_config">
      <label class="mcp-field"><span><TMPL_VAR SETUP.PUBLIC_ORIGIN></span><input name="public_origin" type="url" value="<TMPL_VAR PUBLIC_ORIGIN ESCAPE=HTML>" placeholder="https://loxberry.local" required></label>
      <label class="mcp-field"><span><TMPL_VAR SETUP.MINISERVER_SOURCE></span><select id="miniserver-select" name="miniserver_endpoint"><option value="" <TMPL_IF MANUAL_ENDPOINT>selected</TMPL_IF>><TMPL_VAR SETUP.MANUAL_OPTION></option><TMPL_LOOP MINISERVERS><option value="<TMPL_VAR endpoint ESCAPE=HTML>" <TMPL_IF selected>selected</TMPL_IF>><TMPL_VAR label ESCAPE=HTML></option></TMPL_LOOP></select></label>
      <div id="manual-endpoint-fields" class="mcp-manual-endpoint" <TMPL_UNLESS MANUAL_ENDPOINT>hidden</TMPL_UNLESS>>
        <label class="mcp-field"><span><TMPL_VAR SETUP.ENDPOINT></span><input id="miniserver-endpoint" name="endpoint" type="url" value="<TMPL_VAR ENDPOINT ESCAPE=HTML>" placeholder="http://192.168.1.20" aria-describedby="endpoint-help" <TMPL_IF MANUAL_ENDPOINT>required<TMPL_ELSE>readonly</TMPL_IF>></label>
        <p id="endpoint-help" class="mcp-help"><TMPL_VAR SETUP.ENDPOINT_HELP></p>
      </div>
      <div class="mcp-grid">
        <label class="mcp-field"><span><TMPL_VAR SETUP.TIMEOUT></span><input name="connection_timeout" type="number" min="1" max="60" value="<TMPL_VAR CONNECTION_TIMEOUT ESCAPE=HTML>"></label>
        <label class="mcp-field"><span><TMPL_VAR SETUP.RATE></span><input name="requests_per_minute" type="number" min="1" max="600" value="<TMPL_VAR REQUESTS_PER_MINUTE ESCAPE=HTML>"></label>
        <label class="mcp-field"><span><TMPL_VAR SETUP.CONTROL_RATE></span><input name="control_requests_per_minute" type="number" min="1" max="60" value="<TMPL_VAR CONTROL_REQUESTS_PER_MINUTE ESCAPE=HTML>"></label>
        <label class="mcp-field"><span><TMPL_VAR SETUP.PARALLEL></span><input name="max_parallel_calls" type="number" min="1" max="32" value="<TMPL_VAR MAX_PARALLEL_CALLS ESCAPE=HTML>"></label>
      </div>
      <label><input name="enabled" type="checkbox" value="1" <TMPL_IF ENABLED>checked</TMPL_IF>> <TMPL_VAR SETUP.ENABLED></label>
      <label class="mcp-field">
        <span><TMPL_VAR SETUP.CONTROL_MODE></span>
        <select name="loxone_control_enabled">
          <option value="0" <TMPL_UNLESS LOXONE_CONTROL_ENABLED>selected</TMPL_UNLESS>><TMPL_VAR SETUP.CONTROL_READ_ONLY></option>
          <option value="1" <TMPL_IF LOXONE_CONTROL_ENABLED>selected</TMPL_IF>><TMPL_VAR SETUP.CONTROL_READ_SWITCH></option>
        </select>
      </label>
      <p class="mcp-warning"><TMPL_VAR SETUP.CONTROL_WARNING></p>
      <div class="mcp-actions">
        <button class="lb-button" type="submit"><TMPL_VAR ACTION.SAVE></button>
      </div>
    </form>
    <form class="mcp-actions" method="post" action="index.cgi" data-ajax="test_connection">
      <input type="hidden" name="action" value="test_connection">
      <input type="hidden" name="endpoint" value="<TMPL_VAR ENDPOINT ESCAPE=HTML>">
      <button class="lb-button" type="submit"><TMPL_VAR ACTION.TEST></button>
    </form>
  </section>

  <div class="mcp-grid">
    <section id="status" class="mcp-card" aria-labelledby="status-title">
      <h2 id="status-title"><TMPL_VAR STATUS.TITLE></h2>
      <p><TMPL_VAR STATUS.VERSION>: <code><TMPL_VAR VERSION ESCAPE=HTML></code></p>
      <p><TMPL_VAR STATUS.SERVICE>: <strong id="service-state"><TMPL_IF SERVICE_ACTIVE><TMPL_VAR STATUS.RUNNING><TMPL_ELSE><TMPL_VAR STATUS.STOPPED></TMPL_IF></strong></p>
      <form method="post" action="index.cgi" data-ajax="status"><input type="hidden" name="action" value="status"><button class="lb-button" type="submit"><TMPL_VAR ACTION.REFRESH></button></form>
    </section>

    <section id="help" class="mcp-card" aria-labelledby="help-title">
      <h2 id="help-title"><TMPL_VAR HELP.TITLE></h2>
      <p><TMPL_VAR HELP.TOOL_ACCESS></p>
      <label class="mcp-field"><span><TMPL_VAR HELP.MCP_HOSTNAME></span><span class="mcp-copy-row"><input id="mcp-url-hostname" type="text" readonly value="<TMPL_VAR HOSTNAME_MCP_URL ESCAPE=HTML>"><button class="lb-button" type="button" data-copy-target="mcp-url-hostname"><TMPL_VAR ACTION.COPY></button></span></label>
      <label class="mcp-field"><span><TMPL_VAR HELP.MCP_IP></span><span class="mcp-copy-row"><input id="mcp-url-ip" type="text" readonly value="<TMPL_VAR IP_MCP_URL ESCAPE=HTML>"><button class="lb-button" type="button" data-copy-target="mcp-url-ip"><TMPL_VAR ACTION.COPY></button></span></label>
      <p class="mcp-help"><TMPL_VAR HELP.MCP_CERTIFICATE_HINT></p>
      <p><a id="explorer-link" class="lb-button" href="<TMPL_VAR EXPLORER_URL ESCAPE=HTML>" target="_blank" rel="noopener"><TMPL_VAR ACTION.EXPLORER></a></p>
      <p><a href="https://github.com/Miraculix2050/LoxBerry-Plugin-MCP-Server" target="_blank" rel="noopener"><TMPL_VAR HELP.PROJECT></a></p>
    </section>
  </div>

  <section id="certificate" class="mcp-card" aria-labelledby="certificate-title"
    data-state-scheduled="<TMPL_VAR CERTIFICATE.STATE_SCHEDULED ESCAPE=HTML>"
    data-state-running="<TMPL_VAR CERTIFICATE.STATE_RUNNING ESCAPE=HTML>"
    data-state-success="<TMPL_VAR CERTIFICATE.STATE_SUCCESS ESCAPE=HTML>"
    data-state-error="<TMPL_VAR CERTIFICATE.STATE_ERROR ESCAPE=HTML>"
    data-yes="<TMPL_VAR CERTIFICATE.YES ESCAPE=HTML>"
    data-no="<TMPL_VAR CERTIFICATE.NO ESCAPE=HTML>"
    data-not-configured="<TMPL_VAR CERTIFICATE.NOT_CONFIGURED ESCAPE=HTML>">
    <h2 id="certificate-title"><TMPL_VAR CERTIFICATE.TITLE></h2>
    <p><TMPL_VAR CERTIFICATE.TEXT></p>
    <TMPL_IF CERTIFICATE_AVAILABLE>
      <div class="mcp-grid">
        <p><TMPL_VAR CERTIFICATE.SOURCE>: <strong><TMPL_IF CERTIFICATE_SOURCE_LOXBERRY><TMPL_VAR CERTIFICATE.SOURCE_LOXBERRY><TMPL_ELSE><TMPL_VAR CERTIFICATE.SOURCE_EXTERNAL></TMPL_IF></strong></p>
        <p><TMPL_VAR CERTIFICATE.EXPIRES>: <time id="certificate-expiry" class="mcp-expiry" data-expires-at="<TMPL_VAR CERTIFICATE_EXPIRES_AT ESCAPE=HTML>"><TMPL_VAR CERTIFICATE_EXPIRES ESCAPE=HTML></time></p>
        <p><TMPL_VAR CERTIFICATE.DNS_SANS>: <strong id="certificate-dns-count"><TMPL_VAR CERTIFICATE_DNS_COUNT ESCAPE=HTML></strong></p>
        <p><TMPL_VAR CERTIFICATE.IP_SANS>: <strong id="certificate-ip-count"><TMPL_VAR CERTIFICATE_IP_COUNT ESCAPE=HTML></strong></p>
        <p><TMPL_VAR CERTIFICATE.ORIGIN_MATCH>: <strong id="certificate-origin-match"><TMPL_IF CERTIFICATE_ORIGIN_CONFIGURED><TMPL_IF CERTIFICATE_ORIGIN_MATCHES><TMPL_VAR CERTIFICATE.YES><TMPL_ELSE><TMPL_VAR CERTIFICATE.NO></TMPL_IF><TMPL_ELSE><TMPL_VAR CERTIFICATE.NOT_CONFIGURED></TMPL_IF></strong></p>
        <p><TMPL_VAR CERTIFICATE.HOSTNAME_MATCH>: <strong id="certificate-hostname-match"><TMPL_IF CERTIFICATE_HOSTNAME_MATCHES><TMPL_VAR CERTIFICATE.YES><TMPL_ELSE><TMPL_VAR CERTIFICATE.NO></TMPL_IF></strong></p>
      </div>
      <p id="certificate-warning" class="mcp-warning" <TMPL_UNLESS CERTIFICATE_WARNING>hidden</TMPL_UNLESS>><TMPL_VAR CERTIFICATE.WARNING></p>
      <p><TMPL_VAR CERTIFICATE.RENEWAL_STATE>: <strong id="certificate-renewal-state"><TMPL_VAR CERTIFICATE_RENEWAL_STATE ESCAPE=HTML></strong></p>
      <TMPL_IF CERTIFICATE_RENEWAL_SUPPORTED>
        <form class="mcp-form" method="post" action="index.cgi" data-ajax="renew_certificate" data-certificate-renewal>
          <input type="hidden" name="action" value="renew_certificate">
          <p class="mcp-warning"><TMPL_VAR CERTIFICATE.RENEW_TEXT></p>
          <label class="mcp-field"><span><TMPL_VAR CERTIFICATE.PIN></span><input name="securepin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required></label>
          <label><input name="renew_confirmation" type="checkbox" value="renew" required> <TMPL_VAR CERTIFICATE.CONFIRM></label>
          <div class="mcp-actions"><button class="lb-button" type="submit"><TMPL_VAR ACTION.RENEW_CERTIFICATE></button></div>
        </form>
      <TMPL_ELSE><p class="mcp-help"><TMPL_VAR CERTIFICATE.UNSUPPORTED></p></TMPL_IF>
    <TMPL_ELSE><p class="mcp-status" data-kind="error"><TMPL_VAR CERTIFICATE.UNAVAILABLE></p></TMPL_IF>
  </section>

  <section id="sessions" class="mcp-card" aria-labelledby="sessions-title" data-empty-label="<TMPL_VAR SESSIONS.EMPTY ESCAPE=HTML>">
    <h2 id="sessions-title"><TMPL_VAR SESSIONS.TITLE></h2>
    <div id="session-list">
    <TMPL_IF HAS_SESSIONS>
      <div class="mcp-table-wrap"><table class="mcp-table"><thead><tr><th><TMPL_VAR SESSIONS.CLIENT></th><th><TMPL_VAR SESSIONS.INSTANCE></th><th><TMPL_VAR SESSIONS.IDENTITY></th><th><TMPL_VAR SESSIONS.SCOPES></th><th><TMPL_VAR SESSIONS.EXPIRES></th><th><TMPL_VAR SESSIONS.ACTION></th></tr></thead><tbody>
      <TMPL_LOOP SESSIONS><tr data-session-id="<TMPL_VAR id ESCAPE=HTML>"><td><TMPL_IF client_name><TMPL_VAR client_name ESCAPE=HTML><TMPL_ELSE><TMPL_VAR SESSIONS.UNNAMED></TMPL_IF></td><td><code><TMPL_VAR client ESCAPE=HTML></code></td><td><code><TMPL_VAR identity ESCAPE=HTML></code></td><td><code><TMPL_VAR scopes ESCAPE=HTML></code></td><td><time class="mcp-expiry" data-expires-at="<TMPL_VAR expires_at ESCAPE=HTML>"><TMPL_VAR expires_display ESCAPE=HTML></time></td><td><form method="post" action="index.cgi" data-ajax="revoke_session"><input type="hidden" name="action" value="revoke_session"><input type="hidden" name="id" value="<TMPL_VAR id ESCAPE=HTML>"><button class="lb-button" type="submit"><TMPL_VAR ACTION.REVOKE></button></form></td></tr></TMPL_LOOP>
      </tbody></table></div>
      <form method="post" action="index.cgi" data-ajax="revoke_all"><input type="hidden" name="action" value="revoke_all"><button class="lb-button" type="submit"><TMPL_VAR ACTION.REVOKE_ALL></button></form>
    <TMPL_ELSE><p><TMPL_VAR SESSIONS.EMPTY></p></TMPL_IF>
    </div>
  </section>

  <section id="diagnostics" class="mcp-card" aria-labelledby="diagnostics-title">
    <h2 id="diagnostics-title"><TMPL_VAR DIAGNOSTICS.TITLE></h2>
    <p><TMPL_VAR DIAGNOSTICS.TEXT></p>
    <form method="post" action="index.cgi"><input type="hidden" name="action" value="diagnostic"><button class="lb-button" type="submit"><TMPL_VAR ACTION.DIAGNOSTIC></button></form>
    <TMPL_VAR LOGLIST>
  </section>
</main>

<script>
(() => {
  const status = document.getElementById('ajax-status');
  const miniserverSelect = document.getElementById('miniserver-select');
  const manualEndpointFields = document.getElementById('manual-endpoint-fields');
  const miniserverEndpoint = document.getElementById('miniserver-endpoint');
  const testEndpoint = document.querySelector('form[data-ajax="test_connection"] input[name="endpoint"]');
  const explorerLink = document.getElementById('explorer-link');
  const certificateSection = document.getElementById('certificate');
  const certificateRenewalState = document.getElementById('certificate-renewal-state');
  const certificateExpiry = document.getElementById('certificate-expiry');
  const certificateDnsCount = document.getElementById('certificate-dns-count');
  const certificateIpCount = document.getElementById('certificate-ip-count');
  const certificateOriginMatch = document.getElementById('certificate-origin-match');
  const certificateHostnameMatch = document.getElementById('certificate-hostname-match');
  const certificateWarning = document.getElementById('certificate-warning');
  const syncTestEndpoint = () => { testEndpoint.value = miniserverEndpoint.value; };
  const syncMiniserverSelection = () => {
    const selectedEndpoint = miniserverSelect.value;
    if (selectedEndpoint) miniserverEndpoint.value = selectedEndpoint;
    miniserverEndpoint.readOnly = Boolean(selectedEndpoint);
    miniserverEndpoint.required = !selectedEndpoint;
    manualEndpointFields.hidden = Boolean(selectedEndpoint);
    syncTestEndpoint();
  };
  miniserverSelect.addEventListener('change', syncMiniserverSelection);
  miniserverEndpoint.addEventListener('input', syncTestEndpoint);
  syncMiniserverSelection();
  const expiryFormatter = new Intl.DateTimeFormat(document.documentElement.lang || undefined, {
    dateStyle: 'medium',
    timeStyle: 'medium',
  });
  const MAX_EXPIRY_EPOCH = 4102444799;
  const parseExpiry = (raw) => {
    if (!/^(?:0|[1-9][0-9]*)$/.test(raw) || raw.length > 10) return null;
    const value = Number(raw);
    return Number.isSafeInteger(value) && value <= MAX_EXPIRY_EPOCH ? value : null;
  };
  for (const element of document.querySelectorAll('time.mcp-expiry')) {
    const expiresAt = parseExpiry(element.dataset.expiresAt);
    if (expiresAt !== null) {
      const date = new Date(expiresAt * 1000);
      element.dateTime = date.toISOString();
      element.textContent = expiryFormatter.format(date);
    }
  }
  const hideStatusTimers = new WeakMap();
  const hideSuccess = (element) => {
    window.clearTimeout(hideStatusTimers.get(element));
    hideStatusTimers.set(element, window.setTimeout(() => { element.hidden = true; }, 4000));
  };
  const pageNotice = document.getElementById('page-notice');
  if (pageNotice) {
    const url = new URL(window.location.href);
    url.searchParams.delete('notice');
    window.history.replaceState(null, '', url);
    if (pageNotice.dataset.kind === 'success') hideSuccess(pageNotice);
  }
  for (const button of document.querySelectorAll('button[data-copy-target]')) {
    button.addEventListener('click', async () => {
      const input = document.getElementById(button.dataset.copyTarget);
      if (!input) return;
      try {
        await navigator.clipboard.writeText(input.value);
      } catch {
        input.focus();
        input.select();
        document.execCommand('copy');
      }
      const previous = button.textContent;
      button.textContent = '<TMPL_VAR ACTION.COPIED ESCAPE=JS>';
      window.setTimeout(() => { button.textContent = previous; }, 2000);
    });
  }
  const certificateStateLabels = certificateSection ? {
    scheduled: certificateSection.dataset.stateScheduled,
    running: certificateSection.dataset.stateRunning,
    success: certificateSection.dataset.stateSuccess,
    error: certificateSection.dataset.stateError,
  } : {};
  const updateCertificate = (certificate) => {
    if (!certificate?.available) return;
    if (certificateDnsCount) certificateDnsCount.textContent = String(certificate.dns_san_count);
    if (certificateIpCount) certificateIpCount.textContent = String(certificate.ip_san_count);
    if (certificateOriginMatch) certificateOriginMatch.textContent = certificate.origin_configured
      ? (certificate.origin_matches ? certificateSection.dataset.yes : certificateSection.dataset.no)
      : certificateSection.dataset.notConfigured;
    if (certificateHostnameMatch) certificateHostnameMatch.textContent = certificate.hostname_matches
      ? certificateSection.dataset.yes : certificateSection.dataset.no;
    if (certificateWarning) certificateWarning.hidden = certificate.origin_matches && certificate.hostname_matches;
    const expiresAt = parseExpiry(String(certificate.expires_at));
    if (certificateExpiry && expiresAt !== null) {
      const date = new Date(expiresAt * 1000);
      certificateExpiry.dataset.expiresAt = String(expiresAt);
      certificateExpiry.dateTime = date.toISOString();
      certificateExpiry.textContent = expiryFormatter.format(date);
    }
  };
  const pollCertificateRenewal = async (button, attempt = 0) => {
    if (!certificateRenewalState || attempt >= 30) {
      button.disabled = false;
      button.removeAttribute('aria-busy');
      return;
    }
    await new Promise((resolve) => window.setTimeout(resolve, 2000));
    try {
      const body = new FormData();
      body.set('action', 'certificate_status');
      body.set('ajax', '1');
      const response = await fetch('index.cgi', {method: 'POST', body, headers: {'X-Requested-With': 'XMLHttpRequest'}});
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error('status');
      const state = result.data.certificate?.renewal?.state || 'error';
      certificateRenewalState.textContent = certificateStateLabels[state] || certificateStateLabels.error;
      if (state === 'success') {
        updateCertificate(result.data.certificate);
        button.disabled = false;
        button.removeAttribute('aria-busy');
        return;
      }
      if (state === 'error' || state === 'idle') {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        return;
      }
    } catch {
      // Apache restarts while the LoxBerry Core installs the new certificate.
    }
    pollCertificateRenewal(button, attempt + 1);
  };
  const updateSessions = (sessions) => {
    const activeIds = new Set(sessions.map((session) => session.id));
    const list = document.getElementById('session-list');
    for (const row of list.querySelectorAll('tr[data-session-id]')) {
      if (!activeIds.has(row.dataset.sessionId)) row.remove();
    }
    if (!list.querySelector('tr[data-session-id]')) {
      const empty = document.createElement('p');
      empty.textContent = document.getElementById('sessions').dataset.emptyLabel;
      list.replaceChildren(empty);
    }
  };
  document.addEventListener('submit', async (event) => {
    const form = event.target.closest('form[data-ajax]');
    if (!form) return;
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      let keepButtonDisabled = false;
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      window.clearTimeout(hideStatusTimers.get(status));
      status.hidden = false;
      status.dataset.kind = '';
      status.textContent = '<TMPL_VAR AJAX.WORKING ESCAPE=JS>';
      const body = new FormData(form);
      body.set('ajax', '1');
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch('index.cgi', {method: 'POST', body, signal: controller.signal, headers: {'X-Requested-With': 'XMLHttpRequest'}});
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error?.message || '<TMPL_VAR AJAX.ERROR ESCAPE=JS>');
        status.dataset.kind = 'success';
        status.textContent = '<TMPL_VAR AJAX.SUCCESS ESCAPE=JS>';
        hideSuccess(status);
        if ('service_active' in result.data) document.getElementById('service-state').textContent = result.data.service_active ? '<TMPL_VAR STATUS.RUNNING ESCAPE=JS>' : '<TMPL_VAR STATUS.STOPPED ESCAPE=JS>';
        if (Array.isArray(result.data.sessions)) updateSessions(result.data.sessions);
        if (form.dataset.ajax === 'save_config') {
          const savedEndpoint = result.data.configuration.loxone.endpoint;
          const savedOrigin = result.data.configuration.server.public_origin;
          miniserverEndpoint.value = savedEndpoint;
          explorerLink.href = `${savedOrigin}/admin/plugins/mcpserver/explorer.cgi`;
          syncTestEndpoint();
        }
        if (form.dataset.ajax === 'renew_certificate') {
          keepButtonDisabled = true;
          form.querySelector('input[name="securepin"]').value = '';
          certificateRenewalState.textContent = certificateStateLabels.scheduled;
          pollCertificateRenewal(button);
        }
      } catch (error) {
        status.dataset.kind = 'error';
        if (error instanceof DOMException && error.name === 'AbortError') status.textContent = '<TMPL_VAR AJAX.TIMEOUT ESCAPE=JS>';
        else if (error instanceof TypeError) status.textContent = '<TMPL_VAR AJAX.NETWORK ESCAPE=JS>';
        else status.textContent = error instanceof Error ? error.message : '<TMPL_VAR AJAX.ERROR ESCAPE=JS>';
      } finally {
        window.clearTimeout(timeout);
        if (!keepButtonDisabled) {
          button.disabled = false;
          button.removeAttribute('aria-busy');
        }
      }
  });
})();
</script>
