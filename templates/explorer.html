<style>
  .mcp-explorer { max-width: 92rem; margin: 0 auto; padding: .5rem; overflow-wrap: anywhere; }
  .mcp-explorer-grid { display: grid; grid-template-columns: minmax(15rem, 20rem) minmax(0, 1fr); gap: 1rem; align-items: start; }
  .mcp-explorer-card { min-width: 0; padding: 1rem; border: 1px solid #c9cdd2; border-radius: .4rem; background: #fff; }
  .mcp-explorer-stack { display: grid; gap: .85rem; }
  .mcp-explorer-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .mcp-explorer-actions button, .mcp-explorer-actions select { min-height: 2.75rem; max-width: 100%; }
  .mcp-explorer-status { padding: .65rem; border-left: .3rem solid #6b7280; background: #f3f4f6; }
  .mcp-explorer-status[data-kind="success"] { border-color: #198754; }
  .mcp-explorer-status[data-kind="error"] { border-color: #b91c1c; }
  .mcp-explorer-status[data-kind="working"] { border-color: #1261a0; }
  .mcp-explorer-tool-list { display: grid; gap: .45rem; max-height: 55vh; overflow-y: auto; }
  .mcp-explorer-tool { width: 100%; padding: .7rem; border: 1px solid #c9cdd2; border-radius: .3rem; background: #fff; text-align: left; overflow-wrap: anywhere; }
  .mcp-explorer-tool[aria-current="true"] { border-color: #1261a0; box-shadow: inset .25rem 0 #1261a0; }
  .mcp-explorer-badge { display: inline-block; margin: .25rem .25rem 0 0; padding: .15rem .4rem; border-radius: 1rem; background: #e5e7eb; font-size: .82em; }
  .mcp-explorer-badge[data-kind="danger"] { color: #8b1111; background: #fee2e2; }
  .mcp-explorer-field { display: grid; gap: .35rem; min-width: 0; padding: .65rem; border: 1px solid #ddd; border-radius: .3rem; }
  .mcp-explorer-field input:not([type="checkbox"]), .mcp-explorer-field select, .mcp-explorer-field textarea,
  .mcp-explorer-json { box-sizing: border-box; width: 100%; max-width: 100%; min-height: 2.75rem; font: inherit; }
  .mcp-explorer-json { min-height: 14rem; padding: .65rem; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .mcp-explorer-tabs { display: flex; flex-wrap: wrap; gap: .35rem; border-bottom: 1px solid #c9cdd2; }
  .mcp-explorer-tabs button { min-height: 2.75rem; padding: .45rem .8rem; border: 1px solid transparent; background: transparent; }
  .mcp-explorer-tabs button[aria-selected="true"] { border-color: #c9cdd2 #c9cdd2 #fff; background: #fff; }
  .mcp-explorer-pre { max-height: 30rem; overflow: auto; padding: .75rem; background: #111827; color: #f9fafb; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mcp-explorer-tree { max-height: 30rem; overflow: auto; padding: .5rem; border: 1px solid #ddd; }
  .mcp-explorer-tree ul { margin: .2rem 0 .2rem 1rem; padding-left: .8rem; border-left: 1px solid #ddd; }
  .mcp-explorer-tree li { margin: .25rem 0; list-style: none; }
  .mcp-explorer-value { padding: .15rem .3rem; border: 1px solid transparent; background: transparent; text-align: left; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .mcp-explorer-value:hover { border-color: #1261a0; }
  .mcp-explorer-history { display: grid; gap: .35rem; max-height: 18rem; overflow-y: auto; }
  .mcp-explorer-history button { padding: .55rem; text-align: left; border: 1px solid #ddd; background: #fff; }
  .mcp-explorer-muted { color: #5f6368; }
  .mcp-explorer-warning { padding: .65rem; border-left: .3rem solid #b45309; background: #fff7ed; }
  .mcp-explorer-dialog { width: min(42rem, calc(100% - 2rem)); max-height: calc(100% - 2rem); border: 0; border-radius: .5rem; padding: 1rem; }
  .mcp-explorer-dialog::backdrop { background: rgb(0 0 0 / 55%); }
  .mcp-explorer-dialog select { box-sizing: border-box; width: 100%; min-height: 2.75rem; }
  .mcp-explorer :focus-visible, .mcp-explorer-dialog :focus-visible { outline: 3px solid #1261a0; outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (max-width: 52rem) {
    .mcp-explorer-grid { grid-template-columns: 1fr; }
    .mcp-explorer-tool-list { max-height: none; }
  }
  @media (max-width: 30rem) {
    .mcp-explorer-card { padding: .75rem; }
    .mcp-explorer-actions > button, .mcp-explorer-actions > select { width: 100%; }
    .mcp-explorer-tabs button { flex: 1; }
  }
</style>

<main id="mcp-explorer" class="mcp-explorer mcp-explorer-stack"
  data-ready="<TMPL_VAR EXPLORER.READY ESCAPE=HTML>"
  data-working="<TMPL_VAR EXPLORER.WORKING ESCAPE=HTML>"
  data-error="<TMPL_VAR EXPLORER.ERROR ESCAPE=HTML>"
  data-connected="<TMPL_VAR EXPLORER.CONNECTED ESCAPE=HTML>"
  data-disconnected="<TMPL_VAR EXPLORER.DISCONNECTED ESCAPE=HTML>"
  data-no-tools="<TMPL_VAR EXPLORER.NO_TOOLS ESCAPE=HTML>"
  data-invalid-json="<TMPL_VAR EXPLORER.INVALID_JSON ESCAPE=HTML>"
  data-invalid-arguments="<TMPL_VAR EXPLORER.INVALID_ARGUMENTS ESCAPE=HTML>"
  data-invalid-output="<TMPL_VAR EXPLORER.INVALID_OUTPUT ESCAPE=HTML>"
  data-unsupported-schema="<TMPL_VAR EXPLORER.UNSUPPORTED_SCHEMA ESCAPE=HTML>"
  data-empty-result="<TMPL_VAR EXPLORER.EMPTY_RESULT ESCAPE=HTML>"
  data-empty-history="<TMPL_VAR EXPLORER.EMPTY_HISTORY ESCAPE=HTML>"
  data-no-target="<TMPL_VAR EXPLORER.NO_TARGET ESCAPE=HTML>"
  data-copied="<TMPL_VAR EXPLORER.COPIED ESCAPE=HTML>"
  data-popup-blocked="<TMPL_VAR EXPLORER.POPUP_BLOCKED ESCAPE=HTML>"
  data-auth-cancelled="<TMPL_VAR EXPLORER.AUTH_CANCELLED ESCAPE=HTML>"
  data-token-expired="<TMPL_VAR EXPLORER.TOKEN_EXPIRED ESCAPE=HTML>"
  data-restoring-session="<TMPL_VAR EXPLORER.RESTORING_SESSION ESCAPE=HTML>"
  data-restore-failed="<TMPL_VAR EXPLORER.RESTORE_FAILED ESCAPE=HTML>"
  data-session-other-tab="<TMPL_VAR EXPLORER.SESSION_OTHER_TAB ESCAPE=HTML>"
  data-timeout="<TMPL_VAR EXPLORER.TIMEOUT ESCAPE=HTML>"
  data-control-required="<TMPL_VAR EXPLORER.CONTROL_REQUIRED ESCAPE=HTML>"
  data-as-list="<TMPL_VAR EXPLORER.AS_LIST ESCAPE=HTML>"
  data-optional="<TMPL_VAR EXPLORER.OPTIONAL ESCAPE=HTML>"
  data-array-help="<TMPL_VAR EXPLORER.ARRAY_HELP ESCAPE=HTML>"
  data-object-help="<TMPL_VAR EXPLORER.OBJECT_HELP ESCAPE=HTML>"
  data-help-cursor="<TMPL_VAR EXPLORER.HELP_CURSOR ESCAPE=HTML>"
  data-help-limit="<TMPL_VAR EXPLORER.HELP_LIMIT ESCAPE=HTML>"
  data-help-query="<TMPL_VAR EXPLORER.HELP_QUERY ESCAPE=HTML>"
  data-help-room-uuid="<TMPL_VAR EXPLORER.HELP_ROOM_UUID ESCAPE=HTML>"
  data-help-category-uuid="<TMPL_VAR EXPLORER.HELP_CATEGORY_UUID ESCAPE=HTML>"
  data-help-control-type="<TMPL_VAR EXPLORER.HELP_CONTROL_TYPE ESCAPE=HTML>"
  data-help-control-uuid="<TMPL_VAR EXPLORER.HELP_CONTROL_UUID ESCAPE=HTML>"
  data-help-state-uuids="<TMPL_VAR EXPLORER.HELP_STATE_UUIDS ESCAPE=HTML>"
  data-help-action="<TMPL_VAR EXPLORER.HELP_ACTION ESCAPE=HTML>"
  data-request="<TMPL_VAR EXPLORER.REQUEST ESCAPE=HTML>"
  data-response="<TMPL_VAR EXPLORER.RESPONSE ESCAPE=HTML>"
  data-duration="<TMPL_VAR EXPLORER.DURATION ESCAPE=HTML>"
  data-status="<TMPL_VAR EXPLORER.STATUS ESCAPE=HTML>">

  <section class="mcp-explorer-card" aria-labelledby="explorer-title">
    <h1 id="explorer-title"><TMPL_VAR EXPLORER.TITLE></h1>
    <p><TMPL_VAR EXPLORER.INTRO></p>
    <div class="mcp-explorer-actions">
      <label for="explorer-access-mode"><TMPL_VAR EXPLORER.ACCESS_MODE></label>
      <select id="explorer-access-mode">
        <option value="read"><TMPL_VAR EXPLORER.READ_ONLY></option>
        <option id="explorer-control-option" value="control" disabled><TMPL_VAR EXPLORER.WITH_CONTROL></option>
      </select>
      <button id="explorer-connect" class="lb-button" type="button"><TMPL_VAR EXPLORER.CONNECT></button>
      <button id="explorer-disconnect" class="lb-button" type="button" disabled><TMPL_VAR EXPLORER.DISCONNECT></button>
    </div>
    <p id="explorer-control-note" class="mcp-explorer-warning" hidden><TMPL_VAR EXPLORER.CONTROL_UNAVAILABLE></p>
    <div id="explorer-status" class="mcp-explorer-status" role="status" aria-live="polite"><TMPL_VAR EXPLORER.DISCONNECTED></div>
    <p class="mcp-explorer-muted"><TMPL_VAR EXPLORER.SESSION_POLICY></p>
    <p id="explorer-session-expiry" hidden><strong><TMPL_VAR EXPLORER.SESSION_EXPIRES></strong> <time id="explorer-session-expiry-time"></time></p>
  </section>

  <div class="mcp-explorer-grid">
    <aside class="mcp-explorer-stack">
      <section class="mcp-explorer-card" aria-labelledby="tools-title">
        <h2 id="tools-title"><TMPL_VAR EXPLORER.TOOLS></h2>
        <div id="explorer-tools" class="mcp-explorer-tool-list"><p class="mcp-explorer-muted"><TMPL_VAR EXPLORER.NO_TOOLS></p></div>
      </section>
      <section class="mcp-explorer-card" aria-labelledby="history-title">
        <h2 id="history-title"><TMPL_VAR EXPLORER.HISTORY></h2>
        <div id="explorer-history" class="mcp-explorer-history"><p class="mcp-explorer-muted"><TMPL_VAR EXPLORER.EMPTY_HISTORY></p></div>
      </section>
    </aside>

    <section class="mcp-explorer-card mcp-explorer-stack" aria-labelledby="arguments-title">
      <div id="explorer-tool-summary"><p class="mcp-explorer-muted"><TMPL_VAR EXPLORER.NO_TOOLS></p></div>
      <h2 id="arguments-title"><TMPL_VAR EXPLORER.ARGUMENTS></h2>
      <div class="mcp-explorer-tabs" role="tablist">
        <button id="explorer-form-tab" type="button" role="tab" aria-selected="true" aria-controls="explorer-form-panel"><TMPL_VAR EXPLORER.FORM></button>
        <button id="explorer-json-tab" type="button" role="tab" aria-selected="false" aria-controls="explorer-json-panel"><TMPL_VAR EXPLORER.JSON></button>
      </div>
      <div id="explorer-form-panel" role="tabpanel" aria-labelledby="explorer-form-tab">
        <div id="explorer-form" class="mcp-explorer-stack"></div>
        <p id="explorer-schema-warning" class="mcp-explorer-warning" hidden><TMPL_VAR EXPLORER.UNSUPPORTED_SCHEMA></p>
      </div>
      <div id="explorer-json-panel" role="tabpanel" aria-labelledby="explorer-json-tab" hidden>
        <label for="explorer-json" class="mcp-explorer-muted"><TMPL_VAR EXPLORER.JSON></label>
        <textarea id="explorer-json" class="mcp-explorer-json" spellcheck="false">{}</textarea>
      </div>
      <div class="mcp-explorer-actions">
        <button id="explorer-run" class="lb-button" type="button" disabled><TMPL_VAR EXPLORER.RUN></button>
      </div>
      <div id="explorer-validation" class="mcp-explorer-status" role="alert" data-kind="error" hidden></div>

      <h2><TMPL_VAR EXPLORER.RESULT></h2>
      <div class="mcp-explorer-actions">
        <button id="explorer-copy" class="lb-button" type="button" disabled><TMPL_VAR EXPLORER.COPY_JSON></button>
        <button id="explorer-next-page" class="lb-button" type="button" hidden disabled><TMPL_VAR EXPLORER.NEXT_PAGE></button>
      </div>
      <div id="explorer-result-tree" class="mcp-explorer-tree"><p class="mcp-explorer-muted"><TMPL_VAR EXPLORER.EMPTY_RESULT></p></div>
      <details id="explorer-raw-details"><summary><TMPL_VAR EXPLORER.JSON></summary><pre id="explorer-result-raw" class="mcp-explorer-pre">{}</pre></details>
      <details id="explorer-transcript-details"><summary><TMPL_VAR EXPLORER.TRANSCRIPT></summary><div id="explorer-transcript"></div></details>
    </section>
  </div>
</main>

<dialog id="explorer-confirm" class="mcp-explorer-dialog" aria-labelledby="confirm-title">
  <form method="dialog" class="mcp-explorer-stack">
    <h2 id="confirm-title"><TMPL_VAR EXPLORER.CONFIRM_TITLE></h2>
    <p class="mcp-explorer-warning"><TMPL_VAR EXPLORER.CONFIRM_TEXT></p>
    <p><strong id="explorer-confirm-tool"></strong></p>
    <pre id="explorer-confirm-arguments" class="mcp-explorer-pre"></pre>
    <div class="mcp-explorer-actions">
      <button value="cancel" class="lb-button" type="submit"><TMPL_VAR EXPLORER.CANCEL></button>
      <button id="explorer-confirm-run" value="confirm" class="lb-button" type="submit"><TMPL_VAR EXPLORER.CONFIRM_RUN></button>
    </div>
  </form>
</dialog>

<dialog id="explorer-transfer" class="mcp-explorer-dialog" aria-labelledby="transfer-title">
  <form method="dialog" class="mcp-explorer-stack">
    <h2 id="transfer-title"><TMPL_VAR EXPLORER.TRANSFER></h2>
    <p><code id="explorer-transfer-source"></code></p>
    <label><TMPL_VAR EXPLORER.TRANSFER_TOOL><select id="explorer-transfer-tool"></select></label>
    <label><TMPL_VAR EXPLORER.TRANSFER_FIELD><select id="explorer-transfer-field"></select></label>
    <p id="explorer-transfer-empty" class="mcp-explorer-warning" hidden><TMPL_VAR EXPLORER.NO_TARGET></p>
    <div class="mcp-explorer-actions">
      <button value="cancel" class="lb-button" type="submit"><TMPL_VAR EXPLORER.CANCEL></button>
      <button id="explorer-transfer-apply" value="apply" class="lb-button" type="submit"><TMPL_VAR EXPLORER.APPLY></button>
    </div>
  </form>
</dialog>

<script src="explorer.js?v=<TMPL_VAR VERSION ESCAPE=HTML>"></script>
