  data-authentication-busy="<TMPL_VAR EVENT_HISTORY.AUTHENTICATION_BUSY ESCAPE=HTML>"

  data-to="<TMPL_VAR EVENT_HISTORY.TO ESCAPE=HTML>"
  data-no-events="<TMPL_VAR EVENT_HISTORY.NO_EVENTS ESCAPE=HTML>"
  data-no-coverage="<TMPL_VAR EVENT_HISTORY.NO_COVERAGE ESCAPE=HTML>"
  data-visible-events="<TMPL_VAR EVENT_HISTORY.VISIBLE_EVENTS ESCAPE=HTML>"
  data-listed="<TMPL_VAR EVENT_HISTORY.LISTED ESCAPE=HTML>"
  data-sources-truncated="<TMPL_VAR EVENT_HISTORY.SOURCES_TRUNCATED ESCAPE=HTML>"
  data-hidden-sources="<TMPL_VAR EVENT_HISTORY.HIDDEN_SOURCES ESCAPE=HTML>"
  data-capture-start="<TMPL_VAR EVENT_HISTORY.CAPTURE_START ESCAPE=HTML>"
  data-recording-end="<TMPL_VAR EVENT_HISTORY.RECORDING_END ESCAPE=HTML>"
  data-open-interval="<TMPL_VAR EVENT_HISTORY.OPEN_INTERVAL ESCAPE=HTML>"
  data-status-store-unavailable="<TMPL_VAR EVENT_HISTORY.STATUS_STORE_UNAVAILABLE ESCAPE=HTML>"
  data-status-no-sources="<TMPL_VAR EVENT_HISTORY.STATUS_NO_SOURCES ESCAPE=HTML>"
  data-status-no-visible-sources="<TMPL_VAR EVENT_HISTORY.STATUS_NO_VISIBLE_SOURCES ESCAPE=HTML>"
  data-status-unsupported-value="<TMPL_VAR EVENT_HISTORY.STATUS_UNSUPPORTED_VALUE ESCAPE=HTML>"
  data-status-subscription-unavailable="<TMPL_VAR EVENT_HISTORY.STATUS_SUBSCRIPTION_UNAVAILABLE ESCAPE=HTML>"
  data-status-size-enforcement-failed="<TMPL_VAR EVENT_HISTORY.STATUS_SIZE_ENFORCEMENT_FAILED ESCAPE=HTML>"

  data-selector-filtered="<TMPL_VAR EVENT_HISTORY.SELECTOR_FILTERED ESCAPE=HTML>"

  data-selected-hidden="<TMPL_VAR EVENT_HISTORY.SELECTED_HIDDEN ESCAPE=HTML>"
  data-filter-unknown="<TMPL_VAR EVENT_HISTORY.FILTER_UNKNOWN ESCAPE=HTML>"
  data-filter-limit="<TMPL_VAR EVENT_HISTORY.FILTER_LIMIT ESCAPE=HTML>"
  data-room="<TMPL_VAR EVENT_HISTORY.ROOM ESCAPE=HTML>"
  data-category="<TMPL_VAR EVENT_HISTORY.CATEGORY ESCAPE=HTML>"
  data-type="<TMPL_VAR EVENT_HISTORY.TYPE ESCAPE=HTML>">
  <header class="mcp-event-history-heading">
    <div><a href="index.cgi"><TMPL_VAR EVENT_HISTORY.BACK></a>
      <h1><TMPL_VAR EVENT_HISTORY.TITLE></h1>
      <p class="mcp-help"><TMPL_VAR EVENT_HISTORY.INTRO></p>
    </div>
    <button id="history-refresh" class="lb-button" type="button"><TMPL_VAR EVENT_HISTORY.REFRESH></button>
  </header>
  <div id="history-message" class="mcp-status" role="status" aria-live="polite"><TMPL_VAR EVENT_HISTORY.LOADING></div>
  <noscript><p class="mcp-status" data-kind="warning"><TMPL_VAR EVENT_HISTORY.JAVASCRIPT_REQUIRED></p></noscript>
  <section class="mcp-event-history-metrics" aria-label="<TMPL_VAR EVENT_HISTORY.SUMMARY>">
    <div class="mcp-card"><h2><TMPL_VAR EVENT_HISTORY.RECORDER></h2><strong id="history-recorder"><TMPL_VAR EVENT_HISTORY.LOADING></strong><small id="history-recorder-time"></small></div>
    <div class="mcp-card"><h2><TMPL_VAR EVENT_HISTORY.STORAGE></h2><strong id="history-storage"><TMPL_VAR EVENT_HISTORY.LOADING></strong><small><TMPL_VAR EVENT_HISTORY.STORAGE_HELP></small></div>
    <div class="mcp-card"><h2><TMPL_VAR EVENT_HISTORY.SOURCES></h2><strong id="history-source-count"><TMPL_VAR EVENT_HISTORY.LOADING></strong><small id="history-events"></small></div>
    <div class="mcp-card"><h2><TMPL_VAR EVENT_HISTORY.POLICY></h2><strong id="history-policy"><TMPL_VAR EVENT_HISTORY.LOADING></strong><small id="history-measured"></small></div>
  </section>
  <section class="mcp-card" aria-labelledby="history-sources-title">
    <div class="mcp-event-history-section-head"><div><h2 id="history-sources-title"><TMPL_VAR EVENT_HISTORY.SOURCE_LIST></h2><p class="mcp-help"><TMPL_VAR EVENT_HISTORY.COVERAGE_HELP></p></div></div>
    <div id="history-visibility-warning" class="mcp-status" data-kind="warning" hidden><TMPL_VAR EVENT_HISTORY.VISIBILITY_WARNING></div>
    <div id="history-source-warning" class="mcp-status" data-kind="warning" hidden></div>
    <div class="mcp-table-wrap"><table class="mcp-table mcp-event-history-table">
      <thead><tr><th scope="col"><TMPL_VAR EVENT_HISTORY.CONTROL></th><th scope="col"><TMPL_VAR EVENT_HISTORY.STATE></th><th scope="col"><TMPL_VAR EVENT_HISTORY.STATUS></th><th scope="col"><TMPL_VAR EVENT_HISTORY.EVENTS></th><th scope="col"><TMPL_VAR EVENT_HISTORY.PERIOD></th><th scope="col"><TMPL_VAR EVENT_HISTORY.ACTIONS></th></tr></thead>
      <tbody id="history-source-rows"></tbody>
    </table></div>
    <p id="history-empty" class="mcp-help" hidden><TMPL_VAR EVENT_HISTORY.NO_SOURCES></p>
  </section>
  <section class="mcp-card" aria-labelledby="history-add-title">
    <h2 id="history-add-title"><TMPL_VAR EVENT_HISTORY.ADD_TITLE></h2>
    <p class="mcp-help"><TMPL_VAR EVENT_HISTORY.ADD_HELP></p>
    <div class="mcp-event-history-search"><label class="mcp-field"><span><TMPL_VAR EVENT_HISTORY.SEARCH></span><input id="history-search" type="search" maxlength="100" autocomplete="off" disabled></label><button id="history-search-button" class="lb-button" type="button"><TMPL_VAR EVENT_HISTORY.LOAD_CONTROLS></button></div>
    <p id="history-search-status" class="mcp-help" role="status" aria-live="polite"></p>
    <div class="mcp-event-history-filters">
      <details data-facet="room"><summary><TMPL_VAR EVENT_HISTORY.ROOM></summary><input type="search" aria-label="<TMPL_VAR EVENT_HISTORY.FILTER_ROOM ESCAPE=HTML>" placeholder="<TMPL_VAR EVENT_HISTORY.FILTER_OPTIONS ESCAPE=HTML>"><div class="mcp-event-history-facet-options"></div></details>
      <details data-facet="category"><summary><TMPL_VAR EVENT_HISTORY.CATEGORY></summary><input type="search" aria-label="<TMPL_VAR EVENT_HISTORY.FILTER_CATEGORY ESCAPE=HTML>" placeholder="<TMPL_VAR EVENT_HISTORY.FILTER_OPTIONS ESCAPE=HTML>"><div class="mcp-event-history-facet-options"></div></details>
      <details data-facet="type"><summary><TMPL_VAR EVENT_HISTORY.TYPE></summary><input type="search" aria-label="<TMPL_VAR EVENT_HISTORY.FILTER_TYPE ESCAPE=HTML>" placeholder="<TMPL_VAR EVENT_HISTORY.FILTER_OPTIONS ESCAPE=HTML>"><div class="mcp-event-history-facet-options"></div></details>
      <button id="history-clear-filters" class="lb-button" type="button" disabled><TMPL_VAR EVENT_HISTORY.FILTER_CLEAR></button>
    </div>
    <form id="history-add-form" class="mcp-form">
      <fieldset class="mcp-event-history-control-field"><legend><TMPL_VAR EVENT_HISTORY.CONTROL></legend><div id="history-control-list" class="mcp-event-history-control-list" role="radiogroup" aria-label="<TMPL_VAR EVENT_HISTORY.CONTROL ESCAPE=HTML>"></div><div class="mcp-actions"><button id="history-prev-controls" class="lb-button" type="button" hidden><TMPL_VAR EVENT_HISTORY.PREV_CONTROLS></button><button id="history-more-controls" class="lb-button" type="button" hidden><TMPL_VAR EVENT_HISTORY.MORE_CONTROLS></button></div></fieldset>
      <div class="mcp-event-history-search" id="history-state-search-wrap" hidden><label class="mcp-field"><span><TMPL_VAR EVENT_HISTORY.SEARCH_STATE></span><input id="history-state-search" type="search" maxlength="100" autocomplete="off" disabled></label></div>
      <p id="history-state-search-status" class="mcp-help" role="status" aria-live="polite"></p>
      <label class="mcp-field"><span><TMPL_VAR EVENT_HISTORY.STATES></span><select id="history-state" required disabled><option value=""><TMPL_VAR EVENT_HISTORY.SELECT_STATE></option></select></label>
      <p class="mcp-help"><TMPL_VAR EVENT_HISTORY.STATE_SUPPORT_HELP></p>
      <button id="history-more-states" class="lb-button" type="button" hidden><TMPL_VAR EVENT_HISTORY.SHOW_MORE_STATES></button>
      <div class="mcp-actions"><button id="history-add" class="lb-button" type="submit" disabled><TMPL_VAR EVENT_HISTORY.ADD></button></div>
      <p id="history-add-status" class="mcp-status" role="status" aria-live="polite" hidden></p>
    </form>
  </section>
  <section class="mcp-card" aria-labelledby="history-policy-title">
    <h2 id="history-policy-title"><TMPL_VAR EVENT_HISTORY.SETTINGS></h2>
    <form id="history-policy-form" class="mcp-form">
      <div class="mcp-grid">
        <label class="mcp-field"><span><TMPL_VAR EVENT_HISTORY.RETENTION></span><input id="history-retention" type="number" min="1" max="365" required></label>
        <label class="mcp-field"><span><TMPL_VAR EVENT_HISTORY.MAXIMUM></span><input id="history-maximum" type="number" min="16" max="1024" required></label>
      </div><p class="mcp-help"><TMPL_VAR EVENT_HISTORY.POLICY_HELP></p>
      <div class="mcp-actions"><button class="lb-button" type="submit"><TMPL_VAR EVENT_HISTORY.SAVE></button></div>
    </form>
  </section>
  <section class="mcp-card mcp-event-history-danger" aria-labelledby="history-clear-title">
    <h2 id="history-clear-title"><TMPL_VAR EVENT_HISTORY.CLEAR_TITLE></h2>
    <p class="mcp-help"><TMPL_VAR EVENT_HISTORY.CLEAR_HELP></p>
    <button id="history-clear" class="lb-button" type="button"><TMPL_VAR EVENT_HISTORY.CLEAR></button>
  </section>
</main>
