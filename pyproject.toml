[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loxberry-mcpserver"
version = "0.4.0-alpha.7"
description = "Local MCP server for LoxBerry and Loxone"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "idna==3.18",
    "mcp==1.28.1",
    "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.12.12",
]

[project.scripts]
mcpserver = "mcpserver.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpserver = [
    "skills/using-loxberry-mcp/SKILL.md",
    "skills/using-loxberry-mcp/agents/openai.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mcpserver"]
mypy_path = "src"
